<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jahresguide 2026 – Spanien 🇪🇸</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg: #0f0f1a; --surface: #1a1a2e; --border: #2a2a3e;
            --text: #e8e8f0; --muted: #8888aa; --accent: #6c5ce7;
        }
        body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
        
        /* Layout */
        .app { display:flex; height:100vh; }
        .sidebar { width:380px; display:flex; flex-direction:column; background:var(--surface); border-right:1px solid var(--border); overflow:hidden; }
        .map-wrap { flex:1; position:relative; }
        #map { width:100%; height:100%; }
        
        /* Header */
        .header { padding:16px; border-bottom:1px solid var(--border); }
        .header h1 { font-size:1.3rem; margin-bottom:8px; }
        .header h1 span { opacity:0.6; font-weight:400; font-size:0.9rem; }
        .nav-flags { display:flex; gap:6px; margin-bottom:12px; align-items:center; }
        .nav-flag { display:inline-block; width:36px; height:24px; border-radius:4px; overflow:hidden; opacity:0.4; transition:0.2s; border:2px solid transparent; text-decoration:none; }
        .nav-flag:hover,.nav-flag.active { opacity:1; transform:scale(1.15); border-color:var(--accent); }
        .nav-flag img { width:100%; height:100%; object-fit:cover; display:block; }
        
        /* Search */
        .search { position:relative; margin-bottom:10px; }
        .search input { width:100%; padding:10px 12px 10px 36px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:0.9rem; outline:none; }
        .search input:focus { border-color:var(--accent); }
        .search::before { content:'🔍'; position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:0.85rem; }
        
        /* Stats */
        .stats { display:flex; gap:8px; flex-wrap:wrap; font-size:0.75rem; color:var(--muted); }
        .stat { background:var(--bg); padding:3px 8px; border-radius:4px; }
        
        /* Category filters */
        .cats { display:flex; flex-wrap:wrap; gap:6px; padding:12px 16px; border-bottom:1px solid var(--border); }
        .cat-btn { background:var(--bg); border:1px solid var(--border); color:var(--muted); padding:6px 10px; border-radius:6px; font-size:0.78rem; cursor:pointer; transition:0.2s; }
        .cat-btn:hover { border-color:var(--c); color:var(--text); }
        .cat-btn.active { background:var(--c); color:#fff; border-color:var(--c); }
        .cat-all { background:var(--accent); color:#fff; border-color:var(--accent); }
        
        /* Region filter */
        .regions { display:none; flex-wrap:wrap; gap:4px; padding:8px 16px; border-bottom:1px solid var(--border); max-height:120px; overflow-y:auto; }
        .regions.open { display:flex; }
        .reg-btn { background:var(--bg); border:1px solid var(--border); color:var(--muted); padding:3px 8px; border-radius:4px; font-size:0.72rem; cursor:pointer; }
        .reg-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
        .reg-toggle { width:100%; padding:6px 16px; background:none; border:none; border-bottom:1px solid var(--border); color:var(--muted); font-size:0.78rem; cursor:pointer; text-align:left; }
        .reg-toggle:hover { color:var(--text); }
        
        /* POI List */
        .poi-list { flex:1; overflow-y:auto; padding:8px; }
        .poi-list::-webkit-scrollbar { width:6px; }
        .poi-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
        
        .poi { padding:10px 12px; border-radius:8px; cursor:pointer; border:1px solid transparent; margin-bottom:4px; transition:0.15s; }
        .poi:hover { background:rgba(255,255,255,0.03); border-color:var(--border); }
        .poi-name { font-size:0.88rem; font-weight:600; margin-bottom:2px; }
        .poi-loc { font-size:0.75rem; color:var(--muted); }
        .poi-tags { display:flex; gap:4px; margin-top:4px; flex-wrap:wrap; }
        .poi-tag { font-size:0.68rem; padding:2px 6px; border-radius:3px; background:rgba(255,255,255,0.05); color:var(--muted); }
        .poi-tag.hi { background:rgba(241,196,15,0.15); color:#f1c40f; }
        
        .load-btn { width:100%; padding:12px; background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:8px; color:var(--muted); cursor:pointer; font-size:0.85rem; margin-top:4px; }
        .load-btn:hover { background:rgba(255,255,255,0.06); color:var(--text); }
        
        .cat-header { font-size:0.8rem; font-weight:600; padding:8px 12px 4px; color:var(--muted); display:flex; align-items:center; gap:6px; }
        
        .no-results { text-align:center; padding:40px 20px; color:var(--muted); }
        
        /* Cluster styles */
        .marker-cluster-small,.marker-cluster-medium,.marker-cluster-large { background:rgba(15,15,26,0.7)!important; }
        .marker-cluster-small div,.marker-cluster-medium div,.marker-cluster-large div { background:rgba(108,92,231,0.85)!important; color:#fff!important; font-weight:700; }
        
        /* Popup */
        .leaflet-popup-content-wrapper { background:var(--surface)!important; color:var(--text)!important; border-radius:12px!important; border:1px solid var(--border)!important; }
        .leaflet-popup-tip { background:var(--surface)!important; }
        .leaflet-popup-content { margin:12px 16px!important; }
        .pop-title { font-size:1rem; font-weight:700; margin-bottom:4px; }
        .pop-loc { font-size:0.8rem; color:var(--muted); margin-bottom:8px; }
        .pop-desc { font-size:0.82rem; line-height:1.4; margin-bottom:8px; }
        .pop-hl { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px; }
        .pop-hl span { font-size:0.7rem; background:rgba(255,255,255,0.06); padding:2px 6px; border-radius:3px; }
        .pop-info { display:flex; gap:12px; font-size:0.78rem; color:var(--muted); margin-bottom:10px; }
        .pop-link { display:inline-block; padding:6px 12px; background:var(--accent); color:#fff; text-decoration:none; border-radius:6px; font-size:0.8rem; }
        
        /* Marker */
        .mk { border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; box-shadow:0 2px 8px rgba(0,0,0,0.4); transition:transform 0.15s; }
        .mk:hover { transform:scale(1.2); }
        
        /* Mobile */
        @media(max-width:768px) {
            .app { flex-direction:column-reverse; }
            .sidebar { width:100%; height:45vh; }
            .map-wrap { height:55vh; }
        }
        
        /* Loading */
        .loading { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:9999; transition:opacity 0.3s; }
        .loading.done { opacity:0; pointer-events:none; }
        .spinner { width:40px; height:40px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</head>

, [597, "Fiesta de los Patios Córdoba", "kultur", "Córdoba", "AND", 37.8849, -4.7793, "Mai", 0, "Kostenlos", "Besuch der privaten Blumenpatios (UNESCO)", ["Patios", "Blumen", "Wettbewerb"], 0, "", ""], [598, "Parque Warner Beach", "familie", "San Martín", "MAD", 40.2333, -3.5917, "Jun-Sep", 0, "Ab €15", "Wasserpark-Erweiterung des Parque Warner", ["Wasserrutschen", "DC-Thema", "Wellenbecken"], 0, "", ""], [599, "El Caminito del Rey Desfiladero", "sport", "Ardales", "AND", 36.93, -4.78, "Ganzjährig", 0, "€10", "Adrenalin-Wanderung auf 100m hohen Stegen", ["Stege", "Schlucht", "Hängebrücke"], 0, "", ""], [600, "Flysch Route Zumaia", "sport", "Zumaia", "BAS", 43.295, -2.255, "Ganzjährig", 0, "Ab €20", "Geführte Kajak-Tour entlang der Flysch-Klippen", ["Kajak", "Erdgeschichte", "Klippen"], 0, "", ""], [601, "Weihnachtsbeleuchtung Zaragoza", "weihnachten", "Zaragoza", "ARA", 41.657, -0.8788, "Dez-Jan", 0, "Kostenlos", "Festliche Beleuchtung rund um die Basílica del Pilar", ["Pilar", "Beleuchtung", "Markt"], 0, "", ""]];
        const REGIONS = {"all": "Alle Regionen", "AND": "Andalusien", "CAT": "Katalonien", "MAD": "Madrid", "VAL": "Valencia", "BAS": "Baskenland", "GAL": "Galicien", "CYL": "Kastilien-León", "CLM": "Kastilien-La Mancha", "ARA": "Aragón", "NAV": "Navarra", "MUR": "Murcia", "EXT": "Extremadura", "AST": "Asturien", "KAN": "Kantabrien", "RIO": "La Rioja", "BAL": "Balearen", "KAI": "Kanaren"};
        const CAT_C = {"festival":"#9b59b6","volksfest":"#f39c12","kultur":"#e94560","sport":"#4ecca3","familie":"#3498db","sehenswuerdigkeit":"#f1c40f","weihnachten":"#c0392b"};
        const CAT_I = {"festival":"🎵","volksfest":"🎪","kultur":"🎭","sport":"⚽","familie":"👨‍👩‍👧","sehenswuerdigkeit":"🏛️","weihnachten":"🎄"};
        
        // Unpack compressed POI array
        const POIS = RAW.map(r => ({
            id:r[0],name:r[1],cat:r[2],loc:r[3],reg:r[4],
            lat:r[5],lng:r[6],date:r[7],month:r[8],price:r[9],
            desc:r[10],hl:r[11],hi:r[12],web:r[13]||'',img:r[14]||''
        }));
        
        // ═══ STATE ═══
        let map, cluster, markers = {};
        let filterCat = 'all', filterReg = 'all', filterSearch = '';
        let shown = 0;
        const PAGE = 40;
        
        // ═══ INIT ═══
        function init() {
            map = L.map('map', {zoomControl:true}).setView([40.0,-3.5], 6);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution:'© OSM', maxZoom:19
            }).addTo(map);
            
            buildRegionFilter();
            bindEvents();
            applyFilter();
            
            setTimeout(() => document.getElementById('loader').classList.add('done'), 300);
        }
        
        // ═══ MARKERS (clustered) ═══
        function setMarkers(pois) {
            if (cluster) map.removeLayer(cluster);
            markers = {};
            cluster = L.markerClusterGroup({
                maxClusterRadius:45, disableClusteringAtZoom:12,
                chunkedLoading:true, chunkInterval:150, chunkDelay:20,
                showCoverageOnHover:false
            });
            
            pois.forEach(p => {
                const col = CAT_C[p.cat]||'#888';
                const sz = p.hi ? 36 : 28;
                const icon = L.divIcon({
                    className:'',
                    html:'<div class="mk" style="background:'+col+';width:'+sz+'px;height:'+sz+'px;'+(p.hi?'box-shadow:0 0 12px '+col+'80;':'')+'">'+( CAT_I[p.cat]||'📍')+'</div>',
                    iconSize:[sz,sz], iconAnchor:[sz/2,sz/2]
                });
                const m = L.marker([p.lat,p.lng],{icon});
                m.on('click', () => {
                    m.unbindPopup();
                    m.bindPopup(popup(p),{maxWidth:300}).openPopup();
                });
                cluster.addLayer(m);
                markers[p.id] = m;
            });
            
            map.addLayer(cluster);
        }
        
        function popup(p) {
            const hl = (p.hl||[]).map(h=>'<span>'+h+'</span>').join('');
            return '<div><div class="pop-title">'+(CAT_I[p.cat]||'')+' '+p.name+'</div>'+
                '<div class="pop-loc">📍 '+p.loc+(p.reg?' ('+p.reg+')':'')+'</div>'+
                '<div class="pop-desc">'+p.desc+'</div>'+
                (hl?'<div class="pop-hl">'+hl+'</div>':'')+
                '<div class="pop-info"><span>📅 '+p.date+'</span><span>💰 '+p.price+'</span></div>'+
                (p.img?'<img src="'+p.img+'" style="width:100%;max-height:120px;object-fit:cover;border-radius:8px;margin-bottom:8px;" loading="lazy" onerror="this.style.display=\'none\'">':'')+
                '<div style="display:flex;gap:8px;flex-wrap:wrap;">'+
                (p.web?'<a class="pop-link" href="'+p.web+'" target="_blank">🌐 Website</a>':'')+
                '<a class="pop-link" href="https://www.google.com/maps/search/?api=1&query='+p.lat+','+p.lng+'" target="_blank">📍 Route</a></div></div>';
        }
        
        // ═══ LIST (paginated) ═══
        function renderList(pois) {
            const el = document.getElementById('list');
            shown = 0;
            el.innerHTML = '';
            if (!pois.length) { el.innerHTML='<div class="no-results">🔍 Keine Ergebnisse</div>'; return; }
            loadMore(pois);
        }
        
        function loadMore(pois) {
            const el = document.getElementById('list');
            const old = el.querySelector('.load-btn');
            if (old) old.remove();
            
            const batch = pois.slice(shown, shown + PAGE);
            let lastCat = shown > 0 ? pois[shown-1].cat : null;
            
            batch.forEach(p => {
                if (p.cat !== lastCat) {
                    const h = document.createElement('div');
                    h.className = 'cat-header';
                    h.textContent = (CAT_I[p.cat]||'') + ' ' + (p.cat.charAt(0).toUpperCase()+p.cat.slice(1));
                    el.appendChild(h);
                    lastCat = p.cat;
                }
                const d = document.createElement('div');
                d.className = 'poi';
                d.innerHTML = '<div class="poi-name">'+(CAT_I[p.cat]||'')+' '+p.name+'</div>'+
                    '<div class="poi-loc">📍 '+p.loc+'</div>'+
                    '<div class="poi-tags"><span class="poi-tag">'+p.date+'</span><span class="poi-tag">'+p.price+'</span>'+
                    (p.hi?'<span class="poi-tag hi">⭐ Highlight</span>':'')+'</div>';
                d.onclick = () => {
                    if (markers[p.id]) {
                        map.setView([p.lat,p.lng],14);
                        const m = markers[p.id];
                        m.unbindPopup();
                        m.bindPopup(popup(p),{maxWidth:300}).openPopup();
                    }
                };
                el.appendChild(d);
            });
            
            shown += batch.length;
            if (shown < pois.length) {
                const btn = document.createElement('button');
                btn.className = 'load-btn';
                btn.textContent = '▼ Weitere laden (' + shown + '/' + pois.length + ')';
                btn.onclick = () => loadMore(pois);
                el.appendChild(btn);
            }
        }
        
        // ═══ FILTER ═══
        function getFiltered() {
            let f = POIS;
            if (filterCat !== 'all') f = f.filter(p => p.cat === filterCat);
            if (filterReg !== 'all') f = f.filter(p => p.reg === filterReg);
            if (filterSearch) {
                const s = filterSearch.toLowerCase();
                f = f.filter(p => p.name.toLowerCase().includes(s) || p.loc.toLowerCase().includes(s) || p.desc.toLowerCase().includes(s));
            }
            return f;
        }
        
        function applyFilter() {
            const f = getFiltered();
            document.getElementById('count').textContent = '(' + f.length + ' Orte)';
            setMarkers(f);
            renderList(f);
            updateStats(f);
        }
        
        function updateStats(pois) {
            const cats = {};
            pois.forEach(p => cats[p.cat] = (cats[p.cat]||0)+1);
            document.getElementById('stats').innerHTML = Object.entries(cats)
                .sort((a,b)=>b[1]-a[1])
                .map(([k,v])=>'<span class="stat">'+(CAT_I[k]||'')+' '+v+'</span>')
                .join('');
        }
        
        // ═══ REGIONS ═══
        function buildRegionFilter() {
            const el = document.getElementById('regions');
            if (!REGIONS || Object.keys(REGIONS).length < 2) {
                document.getElementById('reg-toggle').style.display='none';
                return;
            }
            let html = '<button class="reg-btn active" data-reg="all">Alle</button>';
            Object.entries(REGIONS).forEach(([code,name]) => {
                if (code === 'all') return;
                const cnt = POIS.filter(p=>p.reg===code).length;
                if (cnt > 0) html += '<button class="reg-btn" data-reg="'+code+'">'+name+' ('+cnt+')</button>';
            });
            el.innerHTML = html;
            el.querySelectorAll('.reg-btn').forEach(b => {
                b.onclick = () => {
                    el.querySelectorAll('.reg-btn').forEach(x=>x.classList.remove('active'));
                    b.classList.add('active');
                    filterReg = b.dataset.reg;
                    applyFilter();
                };
            });
        }
        
        // ═══ EVENTS ═══
        function bindEvents() {
            // Search
            let timer;
            document.getElementById('search').oninput = e => {
                clearTimeout(timer);
                timer = setTimeout(() => { filterSearch = e.target.value; applyFilter(); }, 250);
            };
            
            // Category buttons
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.onclick = () => {
                    document.querySelectorAll('.cat-btn').forEach(x=>x.classList.remove('active'));
                    b.classList.add('active');
                    filterCat = b.dataset.cat;
                    applyFilter();
                };
            });
            
            // Region toggle
            document.getElementById('reg-toggle').onclick = function() {
                const el = document.getElementById('regions');
                el.classList.toggle('open');
                this.textContent = el.classList.contains('open') ? '▾ Regionen' : '▸ Regionen';
            };
        }
        
        // ═══ START ═══
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
