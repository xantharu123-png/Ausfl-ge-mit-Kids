            const toInput = document.getElementById('camping-to').value.trim();
            if (!fromInput || !toInput) { alert('Bitte Start und Ziel eingeben'); return; }
            document.getElementById('camping-results').innerHTML = '<div class="camping-loading"><div class="camping-loading-text">\u{1F5FA}\uFE0F Berechne Route...</div><div class="camping-loading-sub">Routenplanung via BRouter</div><div class="camping-progress"><div class="camping-progress-bar"></div></div></div>';
            try {
                const fromData = await safeFetchJSON('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(fromInput) + '&limit=1');
                if (!fromData.length) { alert('Startort nicht gefunden'); return; }
                const toData = await safeFetchJSON('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(toInput) + '&limit=1');
                if (!toData.length) { alert('Zielort nicht gefunden'); return; }
                const fromLat = parseFloat(fromData[0].lat), fromLon = parseFloat(fromData[0].lon);
                const toLat = parseFloat(toData[0].lat), toLon = parseFloat(toData[0].lon);
                // Try BRouter first, then OSRM fallback, then straight line
                let coords;
                let routeDistance = 0, routeDuration = 0;
                try {
                    const brData = await safeFetchJSON('https://brouter.de/brouter?lonlats=' + fromLon + ',' + fromLat + '|' + toLon + ',' + toLat + '&profile=car-fast&alternativeidx=0&format=geojson');
                    const geom = brData.features[0].geometry.coordinates;
                    coords = geom.map(c => [c[1], c[0]]);
                    routeDistance = parseInt(brData.features[0].properties['track-length']) || 0;
                    routeDuration = parseInt(brData.features[0].properties['total-time']) || 0;
                } catch(brErr) {
                    try {
                        const osrmData = await safeFetchJSON('https://router.project-osrm.org/route/v1/driving/' + fromLon + ',' + fromLat + ';' + toLon + ',' + toLat + '?overview=full&geometries=geojson');
                        coords = osrmData.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                        routeDistance = osrmData.routes[0].distance || 0;
                        routeDuration = osrmData.routes[0].duration || 0;
                    } catch(osrmErr) {
                        coords = [[fromLat, fromLon], [toLat, toLon]];
                        routeDistance = quickDist(fromLat, fromLon, toLat, toLon) * 1000;
                    }
                }
                if (campingRoute) map.removeLayer(campingRoute);
                campingRoute = L.polyline(coords, { color: '#4ecca3', weight: 4, opacity: 0.8, dashArray: '10, 8' }).addTo(map);
                map.fitBounds(campingRoute.getBounds(), { padding: [50, 50] });
                const routeBounds = campingRoute.getBounds();
                const latBuffer = (routeBounds.getNorth() - routeBounds.getSouth()) * 0.15;
                const lngBuffer = (routeBounds.getEast() - routeBounds.getWest()) * 0.15;
                const south = routeBounds.getSouth() - latBuffer, north = routeBounds.getNorth() + latBuffer;
                const west = routeBounds.getWest() - lngBuffer, east = routeBounds.getEast() + lngBuffer;
                document.getElementById('camping-results').innerHTML = '<div class="camping-loading"><div class="camping-loading-text">\u{1F3D5}\uFE0F Suche Campingplätze entlang der Route...</div><div class="camping-loading-sub">Daten werden von OpenStreetMap geladen</div><div class="camping-progress"><div class="camping-progress-bar"></div></div></div>';
                let query = '[out:json][timeout:30];(';
                if (campingTypes.camping) query += 'node["tourism"="camp_site"](' + south + ',' + west + ',' + north + ',' + east + ');';
                if (campingTypes.caravan) query += 'node["tourism"="caravan_site"](' + south + ',' + west + ',' + north + ',' + east + ');';
                if (campingTypes.parking) { query += 'node["amenity"="parking"]["camping"="yes"](' + south + ',' + west + ',' + north + ',' + east + ');'; query += 'node["tourism"="camp_pitch"](' + south + ',' + west + ',' + north + ',' + east + ');'; }
                query += ');out body 1000;';
                const campData = await safeFetchJSON('https://overpass-api.de/api/interpreter', { method: 'POST', body: 'data=' + encodeURIComponent(query) });
                const routeCoords = coords;
                const nearRoute = (campData.elements || []).filter(site => isNearRoute(site.lat, site.lon, routeCoords, 20));
                nearRoute.sort((a, b) => getRouteProgress(a.lat, a.lon, routeCoords) - getRouteProgress(b.lat, b.lon, routeCoords));
                clearCamping();
                if (campingRoute) map.removeLayer(campingRoute);
                campingRoute = L.polyline(coords, { color: '#4ecca3', weight: 4, opacity: 0.8, dashArray: '10, 8' }).addTo(map);
                campingCluster = L.markerClusterGroup({ maxClusterRadius: 40, disableClusteringAtZoom: 11,
                    iconCreateFunction: function(cluster) { return L.divIcon({ html: '<div style="background:#2d6b4f;color:#4ecca3;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;border:2px solid #4ecca3;">' + cluster.getChildCount() + '</div>', className: '', iconSize: [36, 36] }); }
                });
                const duration = Math.round(routeDuration / 3600 * 10) / 10;
                const distance = Math.round(routeDistance / 1000);
                let html = '<div class="camping-info">\u{1F697} ' + distance + ' km, ~' + duration + 'h Fahrt<br>\u{1F3D5}\uFE0F ' + nearRoute.length + ' Plätze entlang der Route (\u00B120km)</div>';
                nearRoute.forEach((site, i) => {
                    const name = site.tags.name || site.tags.description || 'Unbenannter Platz';
                    let type = 'camping';
                    if (site.tags.tourism === 'caravan_site') type = 'caravan';
                    if (site.tags.amenity === 'parking' || site.tags.tourism === 'camp_pitch') type = 'parking';
                    const typeLabel = { camping: 'Campingplatz', caravan: 'Wohnmobilstellplatz', parking: 'Stellplatz' }[type];
                    const website = site.tags.website || site.tags.url || site.tags['contact:website'] || '';
                    const phone = site.tags.phone || site.tags['contact:phone'] || '';
                    const stars = site.tags.stars ? ' \u2B50' + site.tags.stars : '';
                    const marker = L.marker([site.lat, site.lon], { icon: createCampingIcon(type) });
                    let popup = '<div style="min-width:200px"><strong>' + name + '</strong><br><span style="color:#4ecca3;font-size:12px;">' + typeLabel + stars + '</span>';
                    if (site.tags.opening_hours) popup += '<br>\u{1F552} ' + site.tags.opening_hours;
                    if (site.tags.capacity) popup += '<br>\u{1F4CA} ' + site.tags.capacity + ' Plätze';
                    if (site.tags.fee) popup += '<br>\u{1F4B0} ' + (site.tags.fee === 'yes' ? 'Kostenpflichtig' : site.tags.fee === 'no' ? 'Kostenlos' : site.tags.fee);
                    if (site.tags.power_supply) popup += '<br>\u{1F50C} Strom: ' + (site.tags.power_supply === 'yes' ? 'Ja' : 'Nein');
                    if (site.tags.drinking_water) popup += '<br>\u{1F4A7} Wasser: ' + (site.tags.drinking_water === 'yes' ? 'Ja' : 'Nein');
                    if (site.tags.internet_access) popup += '<br>\u{1F4F6} WiFi: Ja';
                    if (site.tags.toilets) popup += '<br>\u{1F6BB} Toiletten: ' + (site.tags.toilets === 'yes' ? 'Ja' : 'Nein');
                    if (site.tags.shower) popup += '<br>\u{1F6BF} Duschen: ' + (site.tags.shower === 'yes' ? 'Ja' : 'Nein');
                    if (phone) popup += '<br>\u{1F4DE} ' + phone;
                    popup += '<br><a href="https://www.google.com/search?q=' + encodeURIComponent(name) + '" target="_blank" style="color:#4ecca3;">\u{1F50D} Google Suche</a>';
                    popup += ' · <a href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(name) + '+' + site.lat + ',' + site.lon + '" target="_blank" style="color:#ff9800;">\u{1F4CD} Maps</a>';
                    popup += '<div style="font-size:10px;color:#5a6a7a;margin-top:6px;border-top:1px solid #2a3a4a;padding-top:4px;">ℹ️ Daten: OpenStreetMap · Angaben ohne Gewähr</div>';
                    popup += '</div>';
                    marker.bindPopup(popup, { maxWidth: 280 });
                    campingCluster.addLayer(marker);
                    campingMarkers.push(marker);
                    if (i < 80) {
                        html += '<div class="camping-card" onclick="map.setView([46.8182, 8.2275], 8);campingMarkers[' + i + '].openPopup();">';
                        html += '<div class="camping-card-name">' + (i+1) + '. ' + name + '</div>';
                        html += '<div class="camping-card-type">' + typeLabel + stars + '</div>';
                        html += '</div>';
                    }
                });
                map.addLayer(campingCluster);
                document.getElementById('camping-results').innerHTML = html;
            } catch (err) {
                document.getElementById('camping-results').innerHTML = '<div class="camping-info">\u274C Fehler: ' + err.message + '</div>';
            }
        }
        
        function isNearRoute(lat, lon, routeCoords, maxKm) {
            const step = Math.max(1, Math.floor(routeCoords.length / 100));
            for (let i = 0; i < routeCoords.length; i += step) {
                const d = quickDist(lat, lon, routeCoords[i][0], routeCoords[i][1]);
                if (d < maxKm) return true;
            }
            return false;
        }
        
        function getRouteProgress(lat, lon, routeCoords) {
            let minDist = Infinity, bestIdx = 0;
            const step = Math.max(1, Math.floor(routeCoords.length / 200));
            for (let i = 0; i < routeCoords.length; i += step) {
                const d = quickDist(lat, lon, routeCoords[i][0], routeCoords[i][1]);
                if (d < minDist) { minDist = d; bestIdx = i; }
            }
            return bestIdx;
        }
        
        function quickDist(lat1, lon1, lat2, lon2) {
            const dLat = (lat2 - lat1) * 111.32;
            const dLon = (lon2 - lon1) * 111.32 * Math.cos(lat1 * Math.PI / 180);
            return Math.sqrt(dLat * dLat + dLon * dLon);
        }
        

        // POI Visibility Toggle
        let poisVisible = true;
        function togglePOIVisibility() {
            poisVisible = !poisVisible;
            const sw = document.getElementById('poi-switch');
            if (poisVisible) {
                sw.classList.remove('hidden');
                if (window._cluster) map.addLayer(window._cluster);
            } else {
                sw.classList.add('hidden');
                if (window._cluster) map.removeLayer(window._cluster);
            }
        }


        // ============================================
        // AUTOCOMPLETE
        // ============================================
        
        function setupAutocomplete(inputEl, getItems, onSelect) {
            let listEl = inputEl.parentElement.querySelector('.autocomplete-list');
            if (!listEl) {
                listEl = document.createElement('div');
                listEl.className = 'autocomplete-list';
                inputEl.parentElement.classList.add('autocomplete-wrap');
                inputEl.parentElement.appendChild(listEl);
            }
            let activeIdx = -1;
            let currentItems = [];
            let suppressBlur = false;
            
            function render(query) {
                if (!query || query.length < 2) { listEl.classList.remove('visible'); currentItems = []; return; }
                const items = getItems(query);
                if (items.length === 0) { listEl.classList.remove('visible'); currentItems = []; return; }
                currentItems = items.slice(0, 12);
                activeIdx = -1;
                listEl.innerHTML = currentItems.map((item, i) => {
                    const hl = item.name.replace(new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<span class="ac-highlight">$1</span>');
                    const meta = item.meta || '';
                    return '<div class="ac-item" data-idx="' + i + '"><span class="ac-item-name">' + hl + '</span><span class="ac-item-meta">' + meta + '</span></div>';
                }).join('');
                listEl.classList.add('visible');
            }
            
            // Event delegation on list container - much more reliable than per-item handlers
            listEl.addEventListener('mousedown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                suppressBlur = true;
                const item = e.target.closest('.ac-item');
                if (!item) return;
                const idx = parseInt(item.dataset.idx);
                if (currentItems[idx]) {
                    onSelect(currentItems[idx]);
                }
                listEl.classList.remove('visible');
            });
            
            // Touch support
            listEl.addEventListener('touchend', (e) => {
                const item = e.target.closest('.ac-item');
                if (!item) return;
                e.preventDefault();
                suppressBlur = true;
                const idx = parseInt(item.dataset.idx);
                if (currentItems[idx]) {
                    onSelect(currentItems[idx]);
                }
                listEl.classList.remove('visible');
            });
            
            inputEl.addEventListener('input', () => render(inputEl.value.trim()));
            inputEl.addEventListener('focus', () => { if (inputEl.value.trim().length >= 2) render(inputEl.value.trim()); });
            inputEl.addEventListener('blur', () => {
                setTimeout(() => {
                    if (!suppressBlur) listEl.classList.remove('visible');
                    suppressBlur = false;
                }, 250);
            });
            inputEl.addEventListener('keydown', (e) => {
                const items = listEl.querySelectorAll('.ac-item');
                if (!items.length || !listEl.classList.contains('visible')) return;
                if (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = Math.min(activeIdx + 1, items.length - 1); items.forEach((el, i) => el.classList.toggle('active', i === activeIdx)); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); activeIdx = Math.max(activeIdx - 1, 0); items.forEach((el, i) => el.classList.toggle('active', i === activeIdx)); }
                else if (e.key === 'Enter' && activeIdx >= 0) { e.preventDefault(); const idx = parseInt(items[activeIdx].dataset.idx); if (currentItems[idx]) { onSelect(currentItems[idx]); listEl.classList.remove('visible'); } }
                else if (e.key === 'Escape') { listEl.classList.remove('visible'); }
            });
        }
        
        // POI search autocomplete
        const searchInput = document.getElementById('search-input');
        if (searchInput) {
            setupAutocomplete(searchInput, (q) => {
                const ql = q.toLowerCase();
                const catLabels = { sehenswuerdigkeit: 'Sight', familie: 'Familie', kultur: 'Kultur', sport: 'Sport', festival: 'Festival', volksfest: 'Volksfest', weihnachten: 'Markt' };
                // Search name, location, region, description, highlights
                const matches = allPOIs.filter(p => 
                    p.name.toLowerCase().includes(ql) || 
                    p.location.toLowerCase().includes(ql) || 
                    (p.region && p.region.toLowerCase().includes(ql)) ||
                    (p.description && p.description.toLowerCase().includes(ql)) ||
                    (p.highlights && p.highlights.some(h => h.toLowerCase().includes(ql)))
                );
                // Sort: prefix matches first, then by name
                matches.sort((a, b) => {
                    const aP = a.name.toLowerCase().startsWith(ql) ? 0 : a.location.toLowerCase().startsWith(ql) ? 1 : 2;
                    const bP = b.name.toLowerCase().startsWith(ql) ? 0 : b.location.toLowerCase().startsWith(ql) ? 1 : 2;
                    return aP - bP || a.name.localeCompare(b.name);
                });
                // Also add unique locations as group headers
                const results = [];
                const seenLocs = new Set();
                matches.slice(0, 40).forEach(p => {
                    if (!seenLocs.has(p.location) && p.location.toLowerCase().includes(ql)) {
                        seenLocs.add(p.location);
                        results.push({ name: '📍 ' + p.location, meta: p.region || '', poi: { ...p, _isLocation: true } });
                    }
                    results.push({ name: p.name, meta: (catLabels[p.category] || p.category) + ' · ' + p.location, poi: p });
                });
                return results.slice(0, 15);
            }, (item) => {
                if (item.poi._isLocation) {
                    searchInput.value = item.poi.location;
                    searchTerm = item.poi.location;
                } else {
                    searchInput.value = item.poi.name;
                    searchTerm = item.poi.name;
                }
                filterPOIs(false);
                const zoomLevel = item.poi._isLocation ? 12 : 14;
                map.setView([item.poi.lat, item.poi.lng], zoomLevel);
                // Wait for cluster to update, then open popup
                setTimeout(() => {
                    let targetMarker;
                    if (item.poi._isLocation) {
                        const locName = item.poi.location;
                        const firstMatch = allPOIs.find(p => p.location === locName);
                        if (firstMatch) targetMarker = markers[firstMatch.id];
                    } else {
                        targetMarker = markers[item.poi.id];
                    }
                    if (targetMarker) {
                        if (window._cluster && window._cluster.hasLayer(targetMarker)) {
                            window._cluster.zoomToShowLayer(targetMarker, () => {
                                targetMarker.openPopup();
                            });
                        } else {
                            targetMarker.openPopup();
                        }
                    }
                }, 300);
            });
        }
        
        // Camping from/to: Nominatim live geocoding autocomplete
        let _nomTimer = null;
        function setupNominatimAutocomplete(inputEl) {
            let listEl = inputEl.parentElement.querySelector('.autocomplete-list');
            if (!listEl) {
                listEl = document.createElement('div');
                listEl.className = 'autocomplete-list';
                inputEl.parentElement.classList.add('autocomplete-wrap');
                inputEl.parentElement.appendChild(listEl);
            }
            let activeIdx = -1;
            
            async function fetchSuggestions(q) {
                if (!q || q.length < 2) { listEl.classList.remove('visible'); return; }
                // First: local POI matches
                const ql = q.toLowerCase();
                const seen = new Set();
                const local = [];
                allPOIs.forEach(p => {
                    if (!seen.has(p.location) && p.location.toLowerCase().includes(ql)) { seen.add(p.location); local.push({ name: p.location, meta: '📍 ' + (p.region || ''), type: 'local' }); }
                });
                // Then: Nominatim API
                try {
                    const resp = await fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(q) + '&limit=8&addressdetails=1');
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                    const data = await resp.json();
                    data.forEach(r => {
                        const name = r.display_name.split(',').slice(0, 2).join(',');
                        if (!seen.has(name)) { seen.add(name); local.push({ name: r.display_name.split(',').slice(0, 3).join(', ').trim(), meta: '🌐 ' + (r.type || '').replace('_', ' '), type: 'nominatim', full: r.display_name }); }
                    });
                } catch(e) {}
                
                if (local.length === 0) { listEl.classList.remove('visible'); return; }
                activeIdx = -1;
                listEl.innerHTML = local.slice(0, 10).map((item, i) => {
                    const hl = item.name.replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<span class="ac-highlight">$1</span>');
                    return '<div class="ac-item" data-idx="' + i + '"><span class="ac-item-name">' + hl + '</span><span class="ac-item-meta">' + item.meta + '</span></div>';
                }).join('');
                listEl.classList.add('visible');
                const items = local.slice(0, 10);
                listEl.querySelectorAll('.ac-item').forEach(el => {
                    el.addEventListener('mousedown', (e) => { e.preventDefault(); inputEl.value = items[parseInt(el.dataset.idx)].name; listEl.classList.remove('visible'); });
                });
            }
            
            inputEl.addEventListener('input', () => { clearTimeout(_nomTimer); _nomTimer = setTimeout(() => fetchSuggestions(inputEl.value.trim()), 300); });
            inputEl.addEventListener('focus', () => { if (inputEl.value.trim().length >= 2) fetchSuggestions(inputEl.value.trim()); });
            inputEl.addEventListener('blur', () => setTimeout(() => listEl.classList.remove('visible'), 200));
            inputEl.addEventListener('keydown', (e) => {
                const els = listEl.querySelectorAll('.ac-item');
                if (!els.length || !listEl.classList.contains('visible')) return;
                if (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = Math.min(activeIdx + 1, els.length - 1); els.forEach((el, i) => el.classList.toggle('active', i === activeIdx)); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); activeIdx = Math.max(activeIdx - 1, 0); els.forEach((el, i) => el.classList.toggle('active', i === activeIdx)); }
                else if (e.key === 'Enter' && activeIdx >= 0) { e.preventDefault(); els[activeIdx].dispatchEvent(new MouseEvent('mousedown')); }
                else if (e.key === 'Escape') { listEl.classList.remove('visible'); }
            });
        }
        
        const campFrom = document.getElementById('camping-from');
        const campTo = document.getElementById('camping-to');
        if (campFrom) setupNominatimAutocomplete(campFrom);
        if (campTo) setupNominatimAutocomplete(campTo);


        map.on('moveend', function() {
            if (campingMode && !campingRoute) { loadCampingSites(); }
        });

    </script>
<script>setTimeout(()=>{const l=document.getElementById("loading");if(l&&!l.classList.contains("hidden"))l.classList.add("hidden");},3000);</script>
